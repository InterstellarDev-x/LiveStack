server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the vite dev proxy: strip the /api prefix before forwarding to
    # the api service, which mounts its routes at the root (e.g. /websites).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side (react-router) routes survive a refresh.
    location / {
        try_files $uri /index.html;
    }
}
