[package]
name = "webhook-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
messaging = { path = "../messaging" }
store = { path = "../store" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
